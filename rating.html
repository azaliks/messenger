<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<title>Рейтинг</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"gg sans","Helvetica Neue",Helvetica,Arial,sans-serif;background:#000000;color:#dbdee1;height:100vh;height:100dvh;display:flex;overflow:hidden}

.servers{width:80px;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:12px;flex-shrink:0;border-right:1px solid #1a1a1a}
.server-icon{width:48px;height:48px;border-radius:16px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:all .2s;color:#dbdee1;text-decoration:none}
.server-icon:hover{border-radius:14px;background:#5865f2;color:white;transform:scale(1.05)}
.server-icon.active{background:#5865f2;color:white;border-radius:14px;box-shadow:0 0 15px rgba(88,101,242,0.4)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{padding:30px 40px;border-bottom:1px solid #1a1a1a;background:#000000;text-align:center}
.header h1{font-size:32px;font-weight:800;color:#f2f3f5;letter-spacing:-0.5px;margin-bottom:8px}
.header .sub{color:#949ba4;font-size:15px;margin-bottom:20px}
.back-btn{display:inline-block;color:#00a8fc;text-decoration:none;font-size:14px;font-weight:600;padding:8px 16px;background:#1a1a1a;border-radius:12px;transition:all .2s}
.back-btn:hover{background:#2a2a2a;color:#fff}

.content{flex:1;overflow-y:auto;padding:30px 40px; padding-bottom: 40px;}
.container{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.row{background:#1a1a1a;border-radius:20px;padding:20px 24px;display:flex;align-items:center;gap:20px;transition:all .2s;border:2px solid transparent}
.row:hover{transform:translateX(6px);border-color:#2a2a2a}
.row.top1{background:linear-gradient(135deg, #2a1f0a, #1a1a1a);border-color:#f0d030;box-shadow:0 8px 20px rgba(240,208,48,0.1)}
.row.top2{background:linear-gradient(135deg, #1f1f1f, #1a1a1a);border-color:#c0c0c0}
.row.top3{background:linear-gradient(135deg, #2a1a0a, #1a1a1a);border-color:#cd7f32}

.place{font-size:28px;font-weight:800;color:#6d6f78;width:44px;text-align:center;flex-shrink:0}
.row.top1 .place{color:#f0d030;text-shadow:0 0 10px rgba(240,208,48,0.5)}
.row.top2 .place{color:#c0c0c0}
.row.top3 .place{color:#cd7f32}

.avatar{width:56px;height:56px;border-radius:50%;background:#5865f2;color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;flex-shrink:0;object-fit:cover;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
img.avatar{display:block}
.info{flex:1;min-width:0}
.name{color:#f2f3f5;font-size:18px;font-weight:700;margin-bottom:4px}
.stats{color:#949ba4;font-size:13px;font-weight:500}
.score{color:#5865f2;font-size:24px;font-weight:800;flex-shrink:0;background:#2a2a2a;padding:8px 16px;border-radius:14px}

.mobile-nav {display: none;}

@media (max-width: 768px) {
    .servers { display: none; }
    .header { padding: 24px 16px; }
    .header h1 { font-size: 26px; }
    .content { padding: 16px; padding-bottom: 90px; }
    .row { padding: 16px; gap: 12px; border-radius: 16px; }
    .place { font-size: 22px; width: 32px; }
    .avatar { width: 44px; height: 44px; font-size: 18px; }
    .name { font-size: 16px; }
    .stats { font-size: 12px; }
    .score { font-size: 18px; padding: 6px 12px; }
    
    .mobile-nav {
        display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 68px;
        background: #000000; border-top: 1px solid #1a1a1a; z-index: 100;
        padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .mobile-nav .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #80848e; text-decoration: none; font-size: 11px; font-weight: 600; }
    .mobile-nav .nav-item .nav-icon { font-size: 24px; line-height: 1; }
    .mobile-nav .nav-item.active { color: #5865f2; }
}
</style>
</head>
<body>

<nav class="servers">
    <a href="/chat" class="server-icon" title="Чат">💬</a>
    <a href="/games" class="server-icon" title="Игры">🎮</a>
    <a href="/shop" class="server-icon" title="Магазин">🛒</a>
    <a href="/rating" class="server-icon active" title="Рейтинг">🏆</a>
    <a href="/quotes" class="server-icon" title="Цитаты">📝</a>
    <a href="/profile" class="server-icon" title="Профиль">👤</a>
</nav>

<main class="main">
    <div class="header">
        <h1>🏆 Рейтинг банды</h1>
        <p class="sub">Кто активнее всех — по сообщениям, голосовым и картинкам</p>
        <a href="/chat" class="back-btn">← Вернуться в чат</a>
    </div>
    <div class="content">
        <div class="container" id="container">Загрузка...</div>
    </div>
</main>

<nav class="mobile-nav">
    <a href="/chat" class="nav-item"><span class="nav-icon">💬</span>Чаты</a>
    <a href="/games" class="nav-item"><span class="nav-icon">🎮</span>Игры</a>
    <a href="/shop" class="nav-item"><span class="nav-icon">🛒</span>Магазин</a>
    <a href="/profile" class="nav-item"><span class="nav-icon">👤</span>Профиль</a>
</nav>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

async function load() {
    const r = await fetch('/api/rating');
    const data = await r.json();
    const container = document.getElementById('container');

    if (!data.length) {
        container.innerHTML = '<div style="text-align:center;color:#6d6f78;padding:40px;">Пока никого нет в рейтинге</div>';
        return;
    }

    container.innerHTML = data.map((u, i) => {
        const place = i + 1;
        const topClass = place <= 3 ? 'top' + place : '';
        const initial = (u.name || '?').charAt(0).toUpperCase();
        const avatarHtml = u.avatar
            ? `<img class="avatar" src="${u.avatar}" alt="">`
            : `<div class="avatar">${escapeHtml(initial)}</div>`;
        const score = u.messages + u.voices * 2 + u.images * 2;
        return `
            <div class="row ${topClass}">
                <div class="place">${place}</div>
                ${avatarHtml}
                <div class="info">
                    <div class="name">${escapeHtml(u.name)}</div>
                    <div class="stats">
                        💬 ${u.messages} · 🎤 ${u.voices} · 📷 ${u.images} · 😂 ${u.reactions} · 🏆 ${u.achievements}
                    </div>
                </div>
                <div class="score">${score}</div>
            </div>
        `;
    }).join('');
}
load();
fetch('/api/ping', { method: 'POST' });
</script>
</body>
</html>
