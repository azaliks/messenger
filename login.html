<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Чат банды</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: "gg sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #313338;
            color: #dbdee1;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        form {
            background: #313338;
            padding: 32px;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h2 {
            color: #f2f3f5;
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 8px;
        }

        .sub {
            color: #b5bac1;
            font-size: 15px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            text-align: left;
            color: #b5bac1;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #1e1f22;
            border: none;
            border-radius: 4px;
            color: #dbdee1;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            outline: 2px solid #5865f2;
        }
        input::placeholder { color: #6d6f78; }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 24px;
            background: #5865f2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.15s;
        }
        button:hover { background: #4752c4; }
        button:active { background: #3c45a5; }

        .error {
            color: #fa777c;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <form method="POST" action="/login">
        <h2>С возвращением!</h2>
        <p class="sub">Вход только для своих</p>

        <label for="login">Логин</label>
        <input type="text" id="login" name="login" placeholder="Введи логин" required autofocus>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Введи пароль" required>

        <button type="submit">Войти</button>
        <p class="error" id="err"></p>
    </form>

    <script>
        if (location.search.includes('error=1')) {
            document.getElementById('err').textContent = 'Неверный логин или пароль';
        }
    </script>
</body>
</html>
