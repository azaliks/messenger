<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: "gg sans", "Helvetica Neue", Helvetica, Arial, sans-serif; background: #313338; color: #dbdee1; margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; }
        .card { background: #2b2d31; border-radius: 12px; padding: 32px; width: 100%; max-width: 540px; box-shadow: 0 8px 16px rgba(0,0,0,0.24); text-align: center; }
        .avatar-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 20px; }
        .avatar-big { width: 120px; height: 120px; border-radius: 50%; background: #5865f2; color: white; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 600; object-fit: cover; }
        img.avatar-big { display: block; }
        .upload-btn { position: absolute; bottom: 0; right: 0; width: 36px; height: 36px; border-radius: 50%; background: #5865f2; color: white; border: 3px solid #2b2d31; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; font-weight: 600; }
        .upload-btn:hover { background: #4752c4; }
        .upload-btn input { display: none; }
        h1 { color: #f2f3f5; font-size: 22px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .badge-icon { font-size: 24px; }
        .login-sub { color: #949ba4; font-size: 14px; margin-bottom: 8px; }
        .status-view { color: #b5bac1; font-size: 14px; font-style: italic; margin-bottom: 12px; }
        .coins-big { display: inline-block; background: linear-gradient(135deg, #f0d030, #b8860b); color: #1e1f22; padding: 10px 22px; border-radius: 20px; font-weight: 700; font-size: 18px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(240,208,48,0.3); }
        .phrase-block { text-align: left; margin-top: 24px; background: #1e1f22; padding: 16px; border-radius: 8px; }
        .phrase-label { color: #b5bac1; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        .phrase-text { color: #dbdee1; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .phrase-empty { color: #6d6f78; font-style: italic; }
        .section { text-align: left; margin-top: 24px; }
        .section label { display: block; color: #b5bac1; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        .section textarea, .section input[type=text] { width: 100%; padding: 12px; background: #1e1f22; border: none; border-radius: 4px; color: #dbdee1; font-family: inherit; font-size: 15px; outline: none; margin-bottom: 8px; }
        .section textarea { resize: vertical; min-height: 70px; }
        .section textarea:focus, .section input[type=text]:focus { outline: 2px solid #5865f2; }
        .btn { width: 100%; padding: 12px; margin-top: 4px; background: #5865f2; color: white; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 600; }
        .btn:hover { background: #4752c4; }
        .btn.gold { background: #f0d030; color: #1e1f22; }
        .btn.gold:hover { background: #d4b62a; }
        .status-msg { margin-top: 12px; font-size: 14px; min-height: 20px; }
        .ok { color: #23a55a; } .err { color: #fa777c; }
        .back { display: block; margin-top: 24px; color: #00a8fc; text-decoration: none; font-size: 14px; }
        .back:hover { text-decoration: underline; }
        .ach-section { text-align: left; margin-top: 32px; }
        .ach-section h3 { color: #b5bac1; font-size: 12px; font-weight: 700; text-transform: uppercase; margin: 0 0 12px; }
        .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
        .ach-item { background: #1e1f22; border-radius: 8px; padding: 12px 8px; text-align: center; transition: transform 0.15s; }
        .ach-item:hover { transform: scale(1.05); }
        .ach-item .icon { font-size: 28px; margin-bottom: 4px; }
        .ach-item .name { color: #dbdee1; font-size: 11px; font-weight: 600; line-height: 1.2; }
        .ach-empty { color: #6d6f78; font-style: italic; font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin-top: 16px; }
        .stat-item { background: #1e1f22; border-radius: 8px; padding: 10px; text-align: center; }
        .stat-item .n { color: #5865f2; font-size: 20px; font-weight: 700; }
        .stat-item .l { color: #949ba4; font-size: 11px; margin-top: 2px; }
        .daily-block { background: #1e1f22; border-radius: 8px; padding: 14px; margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .daily-block h4 { margin: 0 0 4px; color: #f2f3f5; font-size: 14px; }
        .daily-block p { margin: 0; color: #949ba4; font-size: 12px; }
        .daily-btn { padding: 8px 16px; background: #23a55a; color: white; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; }
        .daily-btn:hover { background: #1e8a4a; }
        .daily-btn:disabled { background: #4e5058; cursor: default; }
        .shop-link { display: block; margin-top: 20px; padding: 12px; background: linear-gradient(135deg, #f0d030, #b8860b); color: #1e1f22; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 15px; }
        .shop-link:hover { filter: brightness(1.1); }

        .purchases { text-align: left; margin-top: 32px; background: #1e1f22; border-radius: 8px; padding: 16px; }
        .purchases h3 { color: #b5bac1; font-size: 12px; font-weight: 700; text-transform: uppercase; margin: 0 0 12px; }
        .purchases .group { margin-bottom: 16px; }
        .purchases .group:last-child { margin-bottom: 0; }
        .purchases .group-label { color: #949ba4; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        .purchases .chips { display: flex; gap: 6px; flex-wrap: wrap; }
        .chip { padding: 4px 10px; background: #2b2d31; border-radius: 20px; font-size: 13px; border: 2px solid transparent; }
        .chip.color-chip { padding: 0; width: 28px; height: 28px; border-radius: 50%; }
        .chip.current { border-color: #f0d030; box-shadow: 0 0 8px rgba(240,208,48,0.5); }
        .chip.badge-chip { font-size: 18px; padding: 4px 10px; }
        .empty-purchases { color: #6d6f78; font-style: italic; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="avatar-wrap" id="avatarWrap">
            <div id="avatarBox" class="avatar-big">?</div>
        </div>
        <h1 id="name"><span id="badgeSpan"></span><span id="nameText">...</span></h1>
        <div class="login-sub" id="loginLabel"></div>
        <div class="status-view" id="statusView" style="display:none;"></div>
        <div class="coins-big" id="coinsBig">💰 0 монет</div>

        <div class="stats-grid" id="statsGrid"></div>

        <div id="phraseView" style="display:none;">
            <div class="phrase-block">
                <div class="phrase-label">Любимая фраза</div>
                <div class="phrase-text" id="phraseText"></div>
            </div>
        </div>

        <div id="editSection" style="display:none;">
            <div class="section">
                <label for="phrase">Любимая фраза</label>
                <textarea id="phrase" placeholder="Напиши свою любимую фразу..."></textarea>
                <button class="btn" id="savePhrase">Сохранить фразу</button>
                <div class="status-msg" id="phraseStatus"></div>
            </div>
            <div class="section">
                <label>Настройки аккаунта</label>
                <input type="text" id="newLogin" placeholder="Новый логин (a-z, 0-9, _)">
                <input type="text" id="newPassword" placeholder="Новый пароль">
                <button class="btn" id="saveCredentials">Сохранить логин/пароль</button>
                <div class="status-msg" id="credStatus"></div>
            </div>

            <div class="daily-block">
                <div>
                    <h4>🎁 Ежедневная награда</h4>
                    <p>+10 монет раз в 24 часа</p>
                </div>
                <button class="daily-btn" id="dailyBtn" onclick="claimDaily()">Получить</button>
            </div>
        </div>

        <div class="purchases" id="purchasesBlock">
            <h3>🛍️ Мои покупки</h3>
            <div id="purchasesList"></div>
        </div>

        <a href="/shop" class="shop-link">🛒 Открыть магазин</a>

        <div class="ach-section">
            <h3>Ачивки</h3>
            <div class="ach-grid" id="achGrid"></div>
        </div>

        <a href="/chat" class="back">← Вернуться в чат</a>
    </div>

    <script>
        const ACHIEVEMENTS = {
            first_message: { name: 'Первое слово', icon: '💬' }, ten_messages: { name: 'Разговорчивый', icon: '🗣️' },
            hundred_messages: { name: 'Флудер', icon: '📢' }, first_voice: { name: 'Голос', icon: '🎤' },
            ten_voices: { name: 'Болтун', icon: '🔊' }, first_image: { name: 'Фотограф', icon: '📷' },
            ten_images: { name: 'Галерея', icon: '🖼️' }, first_reaction: { name: 'Реакция', icon: '😂' },
            hundred_reactions: { name: 'Реактор', icon: '⚡' }, first_call: { name: 'Дозвонился', icon: '📞' },
            ten_calls: { name: 'Телефонист', icon: '☎️' }, night_owl: { name: 'Ночной житель', icon: '🌙' },
            early_bird: { name: 'Ранняя пташка', icon: '🐦' }, week_streak: { name: 'Неделя в чате', icon: '🔥' }
        };
        const avatarWrap = document.getElementById('avatarWrap');
        const avatarBox = document.getElementById('avatarBox');
        const nameText = document.getElementById('nameText');
        const badgeSpan = document.getElementById('badgeSpan');
        const loginLabel = document.getElementById('loginLabel');
        const statusView = document.getElementById('statusView');
        const coinsBig = document.getElementById('coinsBig');
        const statsGrid = document.getElementById('statsGrid');
        const phraseView = document.getElementById('phraseView');
        const phraseText = document.getElementById('phraseText');
        const editSection = document.getElementById('editSection');
        const phraseEl = document.getElementById('phrase');
        const savePhraseBtn = document.getElementById('savePhrase');
        const phraseStatus = document.getElementById('phraseStatus');
        const achGrid = document.getElementById('achGrid');
        const purchasesList = document.getElementById('purchasesList');
        const purchasesBlock = document.getElementById('purchasesBlock');
        const params = new URLSearchParams(location.search);
        const requestedLogin = params.get('user');
        let myLogin = null;
        let isOwn = false;

        function renderStats(stats) {
            stats = stats || {};
            statsGrid.innerHTML = `
                <div class="stat-item"><div class="n">${stats.messages||0}</div><div class="l">Сообщений</div></div>
                <div class="stat-item"><div class="n">${stats.voices||0}</div><div class="l">Голосовых</div></div>
                <div class="stat-item"><div class="n">${stats.images||0}</div><div class="l">Картинок</div></div>
                <div class="stat-item"><div class="n">${stats.reactions||0}</div><div class="l">Реакций</div></div>
                <div class="stat-item"><div class="n">${stats.calls||0}</div><div class="l">Звонков</div></div>
            `;
        }
        function renderAchievements(list) {
            if (!list || !list.length) { achGrid.innerHTML = `<div class="ach-empty">Пока нет ачивок</div>`; return; }
            achGrid.innerHTML = list.map(key => {
                const a = ACHIEVEMENTS[key]; if (!a) return '';
                return `<div class="ach-item"><div class="icon">${a.icon}</div><div class="name">${a.name}</div></div>`;
            }).join('');
        }

        function renderPurchases(p) {
            if (!isOwn) {
                purchasesBlock.style.display = 'none';
                return;
            }
            purchasesBlock.style.display = 'block';

            let html = '';

            // Цвета
            if (p.colors && p.colors.length) {
                html += `<div class="group"><div class="group-label">🎨 Цвета (${p.colors.length})</div><div class="chips">`;
                p.colors.forEach(c => {
                    const isCurrent = p.currentColor === c;
                    html += `<div class="chip color-chip ${isCurrent ? 'current' : ''}" style="background:${c}" title="${isCurrent ? 'Текущий' : ''}"></div>`;
                });
                html += `</div></div>`;
            } else {
                html += `<div class="group"><div class="group-label">🎨 Цвета</div><div class="empty-purchases">Не куплено</div></div>`;
            }

            // Значки
            if (p.badges && p.badges.length) {
                html += `<div class="group"><div class="group-label">⭐ Значки (${p.badges.length})</div><div class="chips">`;
                p.badges.forEach(b => {
                    const isCurrent = p.currentBadge === b;
                    html += `<div class="chip badge-chip ${isCurrent ? 'current' : ''}">${b}</div>`;
                });
                html += `</div></div>`;
            } else {
                html += `<div class="group"><div class="group-label">⭐ Значки</div><div class="empty-purchases">Не куплено</div></div>`;
            }

            // Реакции
            if (p.extraReactions && p.extraReactions.length) {
                html += `<div class="group"><div class="group-label">😂 Реакции (${p.extraReactions.length})</div><div class="chips">`;
                p.extraReactions.forEach(r => {
                    html += `<div class="chip">${r}</div>`;
                });
                html += `</div></div>`;
            } else {
                html += `<div class="group"><div class="group-label">😂 Реакции</div><div class="empty-purchases">Не куплено</div></div>`;
            }

            purchasesList.innerHTML = html;
        }

        async function load() {
            const me = await fetch('/api/me').then(r => r.json());
            myLogin = me.login;
            const targetLogin = requestedLogin || myLogin;
            const p = await fetch('/api/profile/' + targetLogin).then(r => r.json());
            if (p.error) { nameText.textContent = 'Профиль не найден'; return; }

            nameText.textContent = p.name;
            if (p.color) nameText.style.color = p.color;
            if (p.badge) badgeSpan.textContent = p.badge + ' ';
            loginLabel.textContent = '@' + p.login;
            if (p.status) { statusView.textContent = '"' + p.status + '"'; statusView.style.display = 'block'; }
            coinsBig.textContent = '💰 ' + (p.coins || 0) + ' монет';

            if (p.avatar) avatarBox.outerHTML = `<img id="avatarBox" class="avatar-big" src="${p.avatar}" alt="">`;
            else avatarBox.textContent = (p.name || '?').charAt(0).toUpperCase();

            renderStats(p.stats);
            renderAchievements(p.achievements);

            isOwn = !!p.isOwn;
            renderPurchases(p);

            if (p.isOwn) {
                editSection.style.display = 'block';
                phraseView.style.display = 'none';
                phraseEl.value = p.phrase || '';
                const uploadLabel = document.createElement('label');
                uploadLabel.className = 'upload-btn';
                uploadLabel.title = 'Загрузить аватарку';
                uploadLabel.innerHTML = '+<input type="file" id="avatarInput" accept="image/*">';
                avatarWrap.appendChild(uploadLabel);
                uploadLabel.querySelector('input').addEventListener('change', async e => {
                    const file = e.target.files[0]; if (!file) return;
                    const fd = new FormData(); fd.append('avatar', file);
                    const r = await fetch('/api/profile/avatar', { method: 'POST', body: fd });
                    const data = await r.json();
                    if (data.ok) {
                        const img = document.getElementById('avatarBox');
                        if (img.tagName === 'IMG') img.src = data.avatar + '?t=' + Date.now();
                        else img.outerHTML = `<img id="avatarBox" class="avatar-big" src="${data.avatar}" alt="">`;
                    } else alert('Не удалось загрузить');
                });
                savePhraseBtn.addEventListener('click', async () => {
                    phraseStatus.textContent = '';
                    const r = await fetch('/api/profile/phrase', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ phrase: phraseEl.value }) });
                    const data = await r.json();
                    if (data.ok) { phraseStatus.textContent = 'Сохранено!'; phraseStatus.classList.add('ok'); setTimeout(() => { phraseStatus.textContent = ''; }, 2000); }
                    else { phraseStatus.textContent = 'Ошибка'; phraseStatus.classList.add('err'); }
                });
                document.getElementById('saveCredentials').addEventListener('click', async () => {
                    const newLogin = document.getElementById('newLogin').value.trim();
                    const newPassword = document.getElementById('newPassword').value;
                    const st = document.getElementById('credStatus');
                    st.textContent = ''; st.className = 'status-msg';
                    if (!newLogin && !newPassword) { st.textContent = 'Введи новый логин или пароль'; st.classList.add('err'); return; }
                    const r = await fetch('/api/profile/credentials', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ newLogin, newPassword }) });
                    const data = await r.json();
                    if (data.ok) { st.textContent = 'Сохранено!'; st.classList.add('ok'); setTimeout(() => location.href = '/chat', 1500); }
                    else { st.textContent = data.error || 'Ошибка'; st.classList.add('err'); }
                });

                if (!me.dailyReady) {
                    const btn = document.getElementById('dailyBtn');
                    btn.disabled = true;
                    btn.textContent = 'Уже получено';
                }
            } else {
                editSection.style.display = 'none';
                phraseView.style.display = 'block';
                if (p.phrase) { phraseText.textContent = p.phrase; phraseText.classList.remove('phrase-empty'); }
                else { phraseText.textContent = 'Пока ничего не написал'; phraseText.classList.add('phrase-empty'); }
            }
        }

        async function claimDaily() {
            const r = await fetch('/api/daily', { method: 'POST' });
            const data = await r.json();
            if (data.ok) { alert('+' + data.reward + ' монет!'); location.reload(); }
            else { alert(data.error || 'Ошибка'); }
        }

        load();
    </script>
</body>
</html>
