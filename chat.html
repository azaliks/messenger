<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<title>Чат банды</title>
<style>
/* ... (стили оставляем как были, они длинные, я их не трогаю) ... */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"gg sans","Helvetica Neue",Helvetica,Arial,sans-serif;background:#000000;color:#dbdee1;height:100vh;height:100dvh;display:flex;overflow:hidden}

/* А-90 и прочее */
.a90-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: none; flex-direction: column; align-items: center; padding: 40px; backdrop-filter: blur(10px); user-select: none; }
.a90-overlay.active { display: flex; }
.a90-header { text-align: center; margin-bottom: 30px; pointer-events: none; }
.a90-header h1 { font-size: 50px; color: #f23f43; font-weight: 900; text-shadow: 0 0 30px rgba(242,63,67,0.8); animation: pulseRed 1s infinite alternate; }
.a90-header p { color: #fff; font-size: 20px; margin-top: 10px; }
@keyframes pulseRed { from { transform: scale(1); } to { transform: scale(1.05); } }
.a90-stats { display: flex; gap: 40px; font-size: 32px; font-weight: 800; color: #f0d030; margin-bottom: 40px; pointer-events: none; background: #1a1a1a; padding: 20px 40px; border-radius: 20px; border: 2px solid #f0d030; box-shadow: 0 10px 40px rgba(240,208,48,0.3); }
.a90-playground { position: absolute; inset: 0; overflow: hidden; cursor: crosshair; z-index: 1; }
.coin-a90 { position: absolute; font-size: 50px; cursor: pointer; animation: floatCoin 2s infinite alternate ease-in-out; filter: drop-shadow(0 0 15px gold); transition: transform 0.1s; }
.coin-a90:active { transform: scale(0.8); }
@keyframes floatCoin { from { transform: translateY(0); } to { transform: translateY(-10px); } }
.a90-fail { animation: failShake 0.5s infinite; }
@keyframes failShake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
.a90-jumpscare { position: fixed; inset: 0; z-index: 10000; background: #000; display: none; align-items: center; justify-content: center; pointer-events: none; }
.a90-jumpscare.active { display: flex; animation: scareShake 1.5s forwards; }
.a90-jumpscare img { width: 100vw; height: 100vh; object-fit: cover; }
@keyframes scareShake { 0% { transform: scale(0.5) translate(0, 0); opacity: 0; } 10% { transform: scale(1.2) translate(10px, -10px); opacity: 1; } 20% { transform: scale(1.1) translate(-15px, 15px); } 30% { transform: scale(1.3) translate(15px, -15px); } 40% { transform: scale(1.2) translate(-10px, 10px); } 50% { transform: scale(1.3) translate(5px, -5px); } 60% { transform: scale(1.1) translate(-5px, 5px); } 100% { transform: scale(1) translate(0, 0); opacity: 1; } }

@media (max-width: 768px) {
    /* ... стили для мобилки ... */
}
@media (min-width: 769px) {
    .mobile-messages-header, .mobile-nav, .chat-header .back-btn { display: none !important; }
}
</style>
</head>
<body>

<nav class="servers">
    <a href="/chat" class="server-icon active" title="Чат">💬</a>
    <a href="/games" class="server-icon" title="Игры">🎮</a>
    <a href="/shop" class="server-icon" title="Магазин">🛒</a>
    <a href="/rating" class="server-icon" title="Рейтинг">🏆</a>
    <a href="/quotes" class="server-icon" title="Цитаты">📝</a>
    <a href="/profile" class="server-icon" title="Профиль">👤</a>
    <div class="divider"></div>
    <a href="/admin" class="server-icon admin" id="adminIcon" style="display:none" title="Админка">⚙️</a>
</nav>

<aside class="channels">
    <div class="channels-header"># Чат банды <button class="add-btn" onclick="openNewChatModal()">+</button></div>
    <div class="mobile-messages-header">
        <div class="mobile-title">Сообщения</div>
        <div class="mobile-actions">
            <button class="mobile-icon-btn">🔍</button>
            <button class="mobile-add-friends" onclick="openNewChatModal()"><span style="font-size:18px">👤+</span> Добавить друзей</button>
            <button class="mobile-icon-btn plus" onclick="openNewChatModal()">+</button>
        </div>
    </div>
    <div class="channels-list" id="channelsList"></div>
    <div class="user-panel">
        <div class="user-avatar" id="myAvatar">?</div>
        <div class="user-info"><div class="user-name" id="myName">...</div><div class="user-status" id="myStatus">в сети</div></div>
    </div>
</aside>

<main class="chat">
    <div class="chat-header">
        <button class="back-btn" onclick="closeMobileChat()">←</button>
        <span class="hash" id="chatHash">#</span>
        <h2 id="chatTitle">общий</h2>
        <span class="spacer"></span>
        <span id="warnTag" class="pun-tag warn" style="display:none"></span>
        <span id="muteTag" class="pun-tag mute" style="display:none"></span>
        <button class="header-btn" onclick="location.href='/shop'">💰 <span id="coinsTag">0</span></button>
        <button class="header-btn" id="callBtn">📞 Звонок</button>
    </div>
    <div class="mute-banner" id="muteBanner" style="display:none"></div>
    <div class="messages" id="messages"></div>
    <div class="typing-indicator" id="typingIndicator"></div>
    
    <form class="chat-form" id="form">
        <div class="cmd-hint" id="cmdHint"></div>
        <div class="input-wrap">
            <button type="button" class="icon-btn" id="imgBtn" title="Картинка">📎</button>
            <input type="file" id="imgInput" accept="image/*" style="display:none">
            <input type="text" class="chat-input" id="text" placeholder="Написать сообщение" autocomplete="off">
            <button type="button" class="icon-btn voice-btn" id="voiceBtn" title="Удерживай для записи"><img src="/images/mic.png" alt="🎤"></button>
            <button type="submit" class="send-btn" title="Отправить">➤</button>
        </div>
    </form>
</main>

<div class="rec-indicator" id="recIndicator"><span class="rec-dot"></span><span id="recTime">0:00</span> — отпусти, чтобы отправить</div>

<div class="modal-overlay" id="callModal"><div class="modal"><h3>Кому звонить?</h3><div id="userList"></div><button class="cancel" onclick="closeCallModal()">Отмена</button></div></div>
<div class="modal-overlay" id="newChatModal"><div class="modal"><h3>Новый чат</h3><input type="text" id="groupName" placeholder="Название группы (для группы)" style="display:none"><div id="newChatUserList"></div><button class="ok" onclick="createPrivateChat()">Личный чат с одним</button><button class="ok" onclick="createGroupChat()" style="background:#23a55a">Создать группу</button><button class="cancel" onclick="closeNewChatModal()">Отмена</button></div></div>
<div class="cmd-modal" id="cmdModal"><div class="cmd-box"><h3 id="cmdTitle">Команда</h3><div class="cmd-step" id="stepUser"><label>Кого модерация</label><select id="cmdUser"></select></div><div class="cmd-step" id="stepDuration"><label>Время</label><select id="cmdDuration"><option value="5m">5 минут</option><option value="15m" selected>15 минут</option><option value="1h">1 час</option><option value="1d">1 день</option><option value="7d">7 дней</option><option value="forever">Навсегда</option></select></div><div class="cmd-actions"><button class="go" id="cmdGo">Применить</button><button class="cancel-btn" onclick="closeCmdModal()">Отмена</button></div></div></div>
<div class="call-screen" id="callScreen"><div class="call-avatar" id="callAvatar">?</div><div class="call-name" id="callName">...</div><div class="call-status" id="callStatus">...</div><div class="call-actions" id="callActions"></div></div>
<div class="img-viewer" id="imgViewer" onclick="this.classList.remove('active')"><img id="imgViewerImg" src="" alt=""></div>
<audio id="remoteAudio" autoplay"></audio>

<div class="a90-overlay" id="a90Overlay">
    <div class="a90-header"><h1>☠️ А-90 ☠️</h1><p>Набери <b>500 монет</b> за минуту, иначе тебя кикнет!</p></div>
    <div class="a90-stats"><div class="a90-stat"><span id="a90Timer">60</span> сек</div><div class="a90-stat"><span id="a90Coins">0</span> / 500</div></div>
    <div class="a90-playground" id="a90Playground"></div>
</div>
<div class="a90-jumpscare" id="a90Jumpscare"><img src="/images/a-90.jpeg" alt="A-90"></div>
<audio id="a90Siren" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>

<nav class="mobile-nav" id="mobileNav">
    <a href="/chat" class="nav-item active"><span class="nav-icon">💬</span><span>Чаты</span></a>
    <a href="/games" class="nav-item"><span class="nav-icon">🎮</span><span>Игры</span></a>
    <a href="/shop" class="nav-item"><span class="nav-icon">🛒</span><span>Магазин</span></a>
    <a href="/profile" class="nav-item"><span class="nav-icon">👤</span><span>Профиль</span></a>
</nav>

<script src="https://unpkg.com/fix-webm-duration@1.0.6/fix-webm-duration.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

// ==== НОВЫЕ ОБРАБОТЧИКИ АБЬЮЗОВ ====
socket.on('abuse:explode', () => {
    document.body.style.background = '#fff';
    document.body.style.animation = 'failShake 0.2s infinite';
    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;background:white;z-index:9999;opacity:0.8;pointer-events:none;';
    document.body.appendChild(flash);
    setTimeout(() => {
        document.body.style.background = '#000';
        document.body.style.animation = '';
        flash.remove();
        // Кикаем
        fetch('/api/abuse/exit', {method:'POST'}).finally(() => { location.href = '/login?error=1'; });
    }, 2000);
});

socket.on('abuse:music', () => {
    const audio = new Audio('https://www.myinstants.com/media/sounds/roblox-oof.mp3'); // Замени на любой трек
    audio.volume = 1.0;
    audio.loop = true;
    audio.play().catch(()=>{});
    const stopBtn = document.createElement('button');
    stopBtn.textContent = 'ОСТАНОВИТЬ МУЗЫКУ';
    stopBtn.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:15px 30px;background:red;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;';
    stopBtn.onclick = () => { audio.pause(); stopBtn.remove(); };
    document.body.appendChild(stopBtn);
});

socket.on('abuse:flip', () => {
    document.body.style.transform = 'rotate(180deg)';
    setTimeout(() => { document.body.style.transform = ''; }, 10000); // 10 сек
});

// ... (Остальной скрипт с чатом, звонками и А-90 остаётся прежним, я его не дублирую) ...
</script>
</body>
</html>
