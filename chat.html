<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Чат</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background: #ffffff;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            text-align: center;
            padding: 15px;
            color: blue;
            font-size: 22px;
            border-bottom: 1px solid #eee;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            max-width: 60%;
            padding: 10px 14px;
            border-radius: 12px;
            word-wrap: break-word;
        }
        .own {
            align-self: flex-end;
            background: #d6e4ff;
        }
        .other {
            align-self: flex-start;
            background: #f0f0f0;
        }
        .author {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .time {
            font-size: 11px;
            color: #999;
            text-align: right;
            margin-top: 4px;
        }
        .del {
            font-size: 11px;
            color: red;
            cursor: pointer;
            margin-left: 8px;
        }
        form {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
            gap: 10px;
        }
        input[type=text] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
        }
        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
        }
        button:hover { background: darkblue; }
    </style>
</head>
<body>
    <header>Чат банды</header>
    <div id="messages"></div>
    <form id="form">
        <input type="text" id="text" placeholder="Напиши что-нибудь..." autocomplete="off" required>
        <button type="submit">Отправить</button>
    </form>

    <script>
        const messagesEl = document.getElementById('messages');
        const form = document.getElementById('form');
        const textInput = document.getElementById('text');

        let myLogin = null;
        let isAdmin = false;

        function formatTime(iso) {
            const d = new Date(iso);
            return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            })[c]);
        }

        function render(messages) {
            messagesEl.innerHTML = messages.map(m => {
                const own = m.login === myLogin;
                return `
                    <div class="msg ${own ? 'own' : 'other'}">
                        ${own ? '' : `<div class="author">${escapeHtml(m.name)}</div>`}
                        <div>${escapeHtml(m.text)}</div>
                        <div class="time">
                            ${formatTime(m.time)}
                            ${(own || isAdmin) ? `<span class="del" onclick="delMsg('${m.id}')">удалить</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function load() {
            const r = await fetch('/api/messages');
            if (!r.ok) return;
            const data = await r.json();
            render(data);
        }

        form.addEventListener('submit', async e => {
            e.preventDefault();
            const text = textInput.value;
            if (!text.trim()) return;
            textInput.value = '';
            await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            load();
        });

        async function delMsg(id) {
            await fetch('/api/messages/' + id, { method: 'DELETE' });
            load();
        }

        fetch('/api/me').then(r => r.json()).then(u => {
            isAdmin = u.role === 'admin';
            myLogin = u.login;
            load();
        });

        setInterval(load, 3000);
    </script>
</body>
</html>
