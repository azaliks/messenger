<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ Абьюзы</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"gg sans","Helvetica Neue",Helvetica,Arial,sans-serif;background:#000;color:#dbdee1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{color:#f23f43;font-size:32px;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;text-shadow:0 0 20px rgba(242,63,67,0.5);text-align:center}
.sub{color:#949ba4;font-size:16px;margin-bottom:40px;text-align:center}
.panel{background:#1a1a1a;border:2px solid #2a2a2a;border-radius:20px;padding:32px;width:100%;max-width:600px;box-shadow:0 10px 40px rgba(0,0,0,0.8)}
.panel h2{color:#f2f3f5;font-size:22px;margin-bottom:20px; text-align:center}
.target-select{width:100%;padding:14px;background:#000;border:1px solid #3a3a3a;border-radius:12px;color:#fff;font-size:16px;margin-bottom:24px;outline:none;cursor:pointer}
.btn-group{display:flex;flex-direction:column;gap:12px}
.abuse-btn{padding:16px;border:none;border-radius:16px;font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .2s;color:white; display:flex; align-items:center; justify-content:center; gap:10px;}
.abuse-btn.a90{background:linear-gradient(135deg,#f23f43,#b91c1c);box-shadow:0 8px 20px rgba(242,63,67,0.4)}
.abuse-btn.shock{background:linear-gradient(135deg,#f0d030,#b8860b);box-shadow:0 8px 20px rgba(240,208,48,0.4);color:#1e1f22}
.abuse-btn.kick{background:linear-gradient(135deg,#5865f2,#4752c4);box-shadow:0 8px 20px rgba(88,101,242,0.4)}
.abuse-btn.explode{background:linear-gradient(135deg,#fff,#ccc);color:#000;box-shadow:0 8px 20px rgba(255,255,255,0.4)}
.abuse-btn.music{background:linear-gradient(135deg,#23a55a,#1e8a4a);box-shadow:0 8px 20px rgba(35,165,90,0.4)}
.abuse-btn.flip{background:linear-gradient(135deg,#9b59b6,#8e44ad);box-shadow:0 8px 20px rgba(155,89,182,0.4)}
.abuse-btn:hover{transform:translateY(-3px);filter:brightness(1.1); box-shadow: 0 10px 30px rgba(255,255,255,0.1)}
.back{margin-top:30px;color:#00a8fc;text-decoration:none;font-size:16px;font-weight:600}
.back:hover{text-decoration:underline}
</style>
</head>
<body>
<h1>☠️ АДМИН АБЬЮЗЫ ☠️</h1>
<p class="sub">Управление хаосом и разрушением</p>

<div class="panel">
    <h2>Выбери жертву:</h2>
    <select class="target-select" id="targetSelect">
        <option value="all">🌍 ВСЕ ИГРОКИ (Абсолютный хаос)</option>
    </select>

    <div class="btn-group">
        <button class="abuse-btn a90" onclick="triggerAbuse('a90')">🚀 ПРИЗВАТЬ А-90</button>
        <button class="abuse-btn shock" onclick="triggerAbuse('shock')">⚡ УДАРИТЬ ТОКОМ</button>
        <button class="abuse-btn kick" onclick="triggerAbuse('kick')">👢 МГНОВЕННЫЙ КИК</button>
        <button class="abuse-btn explode" onclick="triggerAbuse('explode')">💥 ВЗРЫВ</button>
        <button class="abuse-btn music" onclick="triggerAbuse('music')">🎵 ВКЛЮЧИТЬ МУЗЫКУ</button>
        <button class="abuse-btn flip" onclick="triggerAbuse('flip')">🔄 ПЕРЕВЕРНУТЬ ЭКРАН</button>
    </div>
</div>

<a href="/admin" class="back">← Вернуться в главную админку</a>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const targetSelect = document.getElementById('targetSelect');

fetch('/api/users').then(r=>r.json()).then(users=>{
    users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.login;
        opt.textContent = `${u.name} (@${u.login})`;
        targetSelect.appendChild(opt);
    });
});

function triggerAbuse(type) {
    const target = targetSelect.value;
    if (type === 'a90') socket.emit('admin:start-abuse', { target });
    if (type === 'shock') socket.emit('admin:shock', { target });
    if (type === 'kick') socket.emit('admin:kick', { target });
    if (type === 'explode') socket.emit('admin:explode', { target });
    if (type === 'music') socket.emit('admin:music', { target });
    if (type === 'flip') socket.emit('admin:flip', { target });
}
</script>
</body>
</html>
