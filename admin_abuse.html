<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ Абьюзы</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"gg sans","Helvetica Neue",Helvetica,Arial,sans-serif;background:#000;color:#dbdee1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{color:#f23f43;font-size:32px;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;text-shadow:0 0 20px rgba(242,63,67,0.5);text-align:center}
.sub{color:#949ba4;font-size:16px;margin-bottom:40px;text-align:center}
.panel{background:#1a1a1a;border:2px solid #2a2a2a;border-radius:20px;padding:32px;width:100%;max-width:600px;box-shadow:0 10px 40px rgba(0,0,0,0.8)}
.panel h2{color:#f2f3f5;font-size:22px;margin-bottom:20px}
.target-select{width:100%;padding:14px;background:#000;border:1px solid #3a3a3a;border-radius:12px;color:#fff;font-size:16px;margin-bottom:20px;outline:none;cursor:pointer}
.abuse-btn{width:100%;padding:20px;background:linear-gradient(135deg,#f23f43,#b91c1c);color:white;border:none;border-radius:16px;font-family:inherit;font-size:20px;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .2s;box-shadow:0 8px 20px rgba(242,63,67,0.4)}
.abuse-btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(242,63,67,0.6)}
.abuse-btn:active{transform:translateY(0)}
.abuse-btn:disabled{background:#333;box-shadow:none;cursor:not-allowed;transform:none}
.back{margin-top:30px;color:#00a8fc;text-decoration:none;font-size:16px;font-weight:600}
.back:hover{text-decoration:underline}
.status{margin-top:20px;text-align:center;font-weight:700;font-size:16px;color:#f0d030}
</style>
</head>
<body>
<h1>☠️ АДМИН АБЬЮЗЫ ☠️</h1>
<p class="sub">Управление хаосом и разрушением</p>
<div class="panel">
    <h2>Смертельная игра</h2>
    <label style="color:#949ba4;font-size:13px;font-weight:700;display:block;margin-bottom:8px">Выбери жертву:</label>
    <select class="target-select" id="targetSelect">
        <option value="all">ВСЕ ИГРОКИ (Абсолютный хаос)</option>
    </select>
    <button class="abuse-btn" id="startAbuseBtn">🚀 ПРИЗВАТЬ А-90 🚀</button>
    <div class="status" id="status"></div>
</div>
<a href="/admin" class="back">← Вернуться в главную админку</a>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const targetSelect = document.getElementById('targetSelect');
const startBtn = document.getElementById('startAbuseBtn');
const statusEl = document.getElementById('status');
fetch('/api/users').then(r=>r.json()).then(users=>{
    users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.login;
        opt.textContent = `${u.name} (@${u.login})`;
        targetSelect.appendChild(opt);
    });
});
startBtn.addEventListener('click', () => {
    const target = targetSelect.value;
    socket.emit('admin:start-abuse', { target });
    statusEl.textContent = 'А-90 запущен! Жертва должна набрать 500 монет за минуту!';
    startBtn.disabled = true;
    setTimeout(() => { startBtn.disabled = false; statusEl.textContent = ''; }, 5000);
});
</script>
</body>
</html>
