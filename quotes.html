<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<title>Цитатник</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"gg sans","Helvetica Neue",Helvetica,Arial,sans-serif;background:#000000;color:#dbdee1;height:100vh;height:100dvh;display:flex;overflow:hidden}

.servers{width:80px;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:12px;flex-shrink:0;border-right:1px solid #1a1a1a}
.server-icon{width:48px;height:48px;border-radius:16px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:all .2s;color:#dbdee1;text-decoration:none}
.server-icon:hover{border-radius:14px;background:#5865f2;color:white;transform:scale(1.05)}
.server-icon.active{background:#5865f2;color:white;border-radius:14px;box-shadow:0 0 15px rgba(88,101,242,0.4)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{padding:30px 40px;border-bottom:1px solid #1a1a1a;background:#000000;text-align:center}
.header h1{font-size:32px;font-weight:800;color:#f2f3f5;letter-spacing:-0.5px;margin-bottom:8px}
.header .sub{color:#949ba4;font-size:15px;margin-bottom:20px}
.back-btn{display:inline-block;color:#00a8fc;text-decoration:none;font-size:14px;font-weight:600;padding:8px 16px;background:#1a1a1a;border-radius:12px;transition:all .2s}
.back-btn:hover{background:#2a2a2a;color:#fff}

.content{flex:1;overflow-y:auto;padding:30px 40px; padding-bottom: 40px;}
.container{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.quote{background:#1a1a1a;border-left:4px solid #5865f2;border-radius:16px;padding:24px;position:relative;transition:all .2s}
.quote:hover{background:#1f1f23;transform:translateX(4px)}
.quote .text{color:#f2f3f5;font-size:18px;line-height:1.5;font-style:italic;margin-bottom:12px;word-wrap:break-word;font-weight:500}
.quote .author{color:#5865f2;font-size:14px;font-weight:700}
.quote .date{color:#6d6f78;font-size:12px;margin-left:8px;font-weight:500}
.quote .del{position:absolute;top:16px;right:16px;color:#f23f43;font-size:12px;font-weight:700;cursor:pointer;opacity:0;transition:opacity 0.15s;background:#2a2a2a;padding:4px 10px;border-radius:8px}
.quote:hover .del{opacity:1}
.empty{text-align:center;color:#6d6f78;font-style:italic;padding:60px 20px;font-size:16px}

.mobile-nav {display: none;}

@media (max-width: 768px) {
    .servers { display: none; }
    .header { padding: 24px 16px; }
    .header h1 { font-size: 26px; }
    .content { padding: 16px; padding-bottom: 90px; }
    .quote { padding: 20px; border-radius: 12px; }
    .quote .text { font-size: 16px; }
    
    .mobile-nav {
        display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 68px;
        background: #000000; border-top: 1px solid #1a1a1a; z-index: 100;
        padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .mobile-nav .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #80848e; text-decoration: none; font-size: 11px; font-weight: 600; }
    .mobile-nav .nav-item .nav-icon { font-size: 24px; line-height: 1; }
    .mobile-nav .nav-item.active { color: #5865f2; }
}
</style>
</head>
<body>

<nav class="servers">
    <a href="/chat" class="server-icon" title="Чат">💬</a>
    <a href="/games" class="server-icon" title="Игры">🎮</a>
    <a href="/shop" class="server-icon" title="Магазин">🛒</a>
    <a href="/rating" class="server-icon" title="Рейтинг">🏆</a>
    <a href="/quotes" class="server-icon active" title="Цитаты">📝</a>
    <a href="/profile" class="server-icon" title="Профиль">👤</a>
</nav>

<main class="main">
    <div class="header">
        <h1>💬 Цитатник</h1>
        <p class="sub">Перлы банды — сохраняются навсегда</p>
        <a href="/chat" class="back-btn">← Вернуться в чат</a>
    </div>
    <div class="content">
        <div class="container" id="container">Загрузка...</div>
    </div>
</main>

<nav class="mobile-nav">
    <a href="/chat" class="nav-item"><span class="nav-icon">💬</span>Чаты</a>
    <a href="/games" class="nav-item"><span class="nav-icon">🎮</span>Игры</a>
    <a href="/shop" class="nav-item"><span class="nav-icon">🛒</span>Магазин</a>
    <a href="/profile" class="nav-item"><span class="nav-icon">👤</span>Профиль</a>
</nav>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
let isAdmin = false;
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

async function load() {
    const me = await fetch('/api/me').then(r => r.json());
    isAdmin = me.role === 'admin';
    const r = await fetch('/api/quotes');
    const quotes = await r.json();
    const container = document.getElementById('container');

    if (!quotes.length) {
        container.innerHTML = `<div class="empty">Пока ни одной цитаты. Наведи на сообщение в чате и нажми 💬, чтобы сохранить.</div>`;
        return;
    }

    container.innerHTML = quotes.slice().reverse().map(q => {
        const d = new Date(q.savedAt).toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric' });
        return `
            <div class="quote">
                <div class="text">«${escapeHtml(q.text)}»</div>
                <div><span class="author">— ${escapeHtml(q.author)}</span><span class="date">${d}</span></div>
                ${isAdmin ? `<span class="del" onclick="delQuote('${q.id}')">удалить</span>` : ''}
            </div>
        `;
    }).join('');
}

async function delQuote(id) {
    if (!confirm('Удалить цитату?')) return;
    await fetch('/api/quotes/' + id, { method: 'DELETE' });
    load();
}
load();
fetch('/api/ping', { method: 'POST' });
</script>
</body>
</html>
